name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php --version
      # The generated code must be exactly what the spec in the repo produces.
      - name: Generated code is up to date
        run: python3 scripts/generate.py && git add -N . && git diff --exit-code
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan --no-progress
      - run: vendor/bin/phpunit

  # Read-only calls to the real API, checked against the spec. Needs a key
  # with email:read and domain:read in the SMTPFAST_API_KEY secret.
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit tests/LiveTest.php
        env:
          SMTPFAST_API_KEY: ${{ secrets.SMTPFAST_API_KEY }}
