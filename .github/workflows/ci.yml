name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php --version
      # The generated code must be exactly what the spec in the repo produces.
      - name: Generated code is up to date
        run: python3 scripts/generate.py && git add -N . && git diff --exit-code
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan --no-progress
      - run: vendor/bin/phpunit

  # Read-only calls to the real API, checked against the spec. Runs only when
  # started by hand (Actions > CI > Run workflow). Needs a key with email:read
  # and domain:read in the SMTPFAST_API_KEY secret.
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: Fail when the secrets are missing, instead of skipping every test
        run: test -n "$SMTPFAST_API_KEY" || { echo "::error::Set the SMTPFAST_API_KEY secret"; exit 1; }
        env:
          SMTPFAST_API_KEY: ${{ secrets.SMTPFAST_API_KEY }}
      - run: vendor/bin/phpunit tests/LiveTest.php --display-skipped
        env:
          SMTPFAST_API_KEY: ${{ secrets.SMTPFAST_API_KEY }}
          SMTPFAST_TEST_FROM: ${{ secrets.SMTPFAST_TEST_FROM }}
